<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spymc.xyz – Minecraft Server</title>
  <style>
    /* ----- CONFIGURATION -----
       Change the values below to match your server.
    */
    :root {
      --server-ip: "spymc.xyz";
      --discord-url: "https://discord.gg/your-invite";
      --store-url: "https://store.spymc.xyz";
    }
    /* ------------------------ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      color: #fff;
      padding: 20px;
      /* Background image with dark overlay */
      background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url('https://i.ibb.co/JWQwTrMn/wp8324581-8k-minecraft-wallpapers.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      max-width: 700px;
      width: 100%;
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #f9d976, #f39f86);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
    }

    .subtitle {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .ip-display {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 60px;
      padding: 12px 24px;
      display: inline-block;
      margin-bottom: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      color: #aaa;
      letter-spacing: 1px;
    }
    .ip-display strong {
      color: #fff;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 40px;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      transition: all 0.25s ease;
      cursor: pointer;
      min-width: 160px;
      letter-spacing: 0.5px;
      flex: 1 1 auto;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    /* Individual button colours */
    .btn-discord {
      background: #5865F2;
      border-color: #5865F2;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }
    .btn-discord:hover {
      background: #4752c4;
      border-color: #4752c4;
      box-shadow: 0 8px 25px rgba(88, 101, 242, 0.5);
    }

    .btn-store {
      background: #f39c12;
      border-color: #f39c12;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
    }
    .btn-store:hover {
      background: #d68910;
      border-color: #d68910;
      box-shadow: 0 8px 25px rgba(243, 156, 18, 0.5);
    }

    .btn-join {
      background: #2ecc71;
      border-color: #2ecc71;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
    }
    .btn-join:hover {
      background: #27ae60;
      border-color: #27ae60;
      box-shadow: 0 8px 25px rgba(46, 204, 113, 0.5);
    }

    .btn i {
      font-size: 1.2rem;
    }

    /* Feedback message */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 32px 20px;
        border-radius: 24px;
      }
      .logo {
        font-size: 2.2rem;
      }
      .subtitle {
        font-size: 1rem;
      }
      .btn {
        padding: 14px 24px;
        font-size: 1rem;
        min-width: 120px;
        flex: 1 1 100%;
      }
      .buttons {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .ip-display {
        font-size: 0.95rem;
        padding: 10px 18px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">⛏️ spymc</div>
  <div class="subtitle">A premium Minecraft experience</div>

  <div class="ip-display">
    <strong>IP:</strong> <span id="serverIp">spymc.xyz</span>
  </div>

  <div class="buttons">
    <a href="#" id="discordBtn" class="btn btn-discord" target="_blank" rel="noopener">
      <i class="fab fa-discord"></i> Discord
    </a>
    <a href="#" id="storeBtn" class="btn btn-store" target="_blank" rel="noopener">
      <i class="fas fa-shopping-cart"></i> Store
    </a>
    <button id="joinBtn" class="btn btn-join">
      <i class="fas fa-copy"></i> Join
    </button>
  </div>
</div>

<!-- Toast notification -->
<div id="toast" class="toast">IP copied to clipboard!</div>

<!-- Font Awesome (free) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
  // ============================================================
  //  CONFIGURATION – Edit these values to match your server
  // ============================================================
  const CONFIG = {
    ip: "spymc.xyz",                // Your server IP
    discord: "https://discord.gg/your-invite",   // Discord invite link
    store: "https://store.spymc.xyz"              // Store URL
  };
  // ============================================================

  // DOM elements
  const ipDisplay = document.getElementById('serverIp');
  const discordBtn = document.getElementById('discordBtn');
  const storeBtn = document.getElementById('storeBtn');
  const joinBtn = document.getElementById('joinBtn');
  const toast = document.getElementById('toast');

  // Set IP in the display
  ipDisplay.textContent = CONFIG.ip;

  // Set button links
  discordBtn.href = CONFIG.discord;
  storeBtn.href = CONFIG.store;

  // Join button – copy IP to clipboard
  joinBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await navigator.clipboard.writeText(CONFIG.ip);
      showToast('IP copied to clipboard!');
    } catch (err) {
      // Fallback for older browsers
      const textArea = document.createElement('textarea');
      textArea.value = CONFIG.ip;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      showToast('IP copied to clipboard!');
    }
  });

  // Toast helper
  let toastTimeout;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // (Optional) Prevent default on Discord/Store if links are empty
  // but we already set them from CONFIG.
</script>
</body>
</html>
